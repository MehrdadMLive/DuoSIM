name: DuoSIM Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Gateway and Main Phone debug APKs
        run: |
          ./gradlew --no-daemon \
            :app:assembleDebug \
            :phone:assembleFullDebug \
            :phone:assembleFossDebug

      # Keep JVM test scope aligned with upstream CI. The app's lifecycle test imports
      # generated/native PJSIP bindings that are not available on a plain hosted JVM runner.
      - name: Run upstream JVM tests
        run: |
          ./gradlew --no-daemon \
            :sip:test \
            :gateway:test

      - name: Upload debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duosim-debug-apks
          path: |
            app/build/outputs/apk/**/*.apk
            phone/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
